services:
  - type: web
    name: ptb-scholar-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STUDY_ACCESS_CODE
        sync: false
      - key: STUDENT_PROFILES_JSON
        sync: false
      - key: RETRIEVAL_MODE
        value: lexical
